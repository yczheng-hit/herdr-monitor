[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-monitor"
version = "0.3.0"
description = "Foreground herdr agent monitor with guarded permission confirmation"
requires-python = ">=3.11"
dependencies = ["textual==8.2.8"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
herdr-monitor = "herdr_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
herdr_monitor = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
